name: Submodule PR
on:
    pull_request:
        branches: [develop]
        types: [closed]
jobs:
  CanDIG-dispatch:
    runs-on: ubuntu-latest
    env:
      PARENT_REPOSITORY: 'CanDIG/CanDIGv2'
      PARENT_REPO_NAME: 'CanDIGv2'
      CHECKOUT_BRANCH: 'develop'
      PR_AGAINST_BRANCH: 'develop'
      OWNER: 'CanDIG'
    if: github.event.pull_request.merged == true
    steps:
            - name: Check out repository code
              uses: actions/checkout@v6
            - name: Generate GitHub App token
              uses: actions/create-github-app-token@v1
              id: app-token
              with:
                  app-id: ${{ vars.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  owner: ${{ env.OWNER }}
                  # Scope the token to only the parent repo for least-privilege
                  repositories: ${{ env.PARENT_REPO_NAME }}
            - name: Create PR in CanDIGv2
              id: make_pr
              uses: CanDIG/github-action-pr-expanded@v5
              with:
                  github_token: ${{ steps.app-token.outputs.token }}
                  parent_repository: ${{ env.PARENT_REPOSITORY }}
                  checkout_branch: ${{ env.CHECKOUT_BRANCH}}
                  pr_against_branch: ${{ env.PR_AGAINST_BRANCH }}
                  pr_title: "${{ github.repository }} merging: ${{ github.event.pull_request.title }}"
                  pr_description: "PR triggered by update to develop branch on ${{ github.repository }}. Commit hash: `${{ github.sha }}`. PR link: [#${{ github.event.pull_request.number }}](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }})"
                  owner: ${{ env.OWNER }}
                  submodule_path: lib/candig-ingest/candigv2-ingest
